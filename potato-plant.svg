    <g fill="var(--soil-speck, #795038)" opacity="0.55">
      <circle cx="82" cy="285" r="4" /><circle cx="126" cy="348" r="3" />
      <circle cx="402" cy="292" r="4" /><circle cx="446" cy="366" r="3" />
      <circle cx="94" cy="393" r="2.5" /><circle cx="392" cy="395" r="2.5" />
