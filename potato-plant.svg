<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title description" style="--root-growth:1;--sprout-growth:1">
  <title id="title">Pianta di patate di Tato Tracker</title>
  <desc id="description">Una pianta verde emerge dalla terra sopra radici e patate.</desc>
