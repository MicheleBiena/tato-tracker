    <path d="M0 260c78-18 142 10 220-5 100-19 196-4 300 10v155H0Z" fill="var(--soil-front, #946647)" opacity="0.5" />

    <g fill="none" stroke="var(--root-color, #f4dcc0)" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" d="M260 218C258 250 262 280 255 307c-4 26-12 52-31 79" stroke-width="7" style="stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--root-growth, 0));transition:stroke-dashoffset .75s ease-out" />
      <path pathLength="1" d="M258 259c-20 8-35 24-47 43" stroke-width="4" style="stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--root-growth, 0));transition:stroke-dashoffset .75s ease-out" />
      <path pathLength="1" d="M256 286c25 6 47 22 65 43" stroke-width="4.5" style="stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--root-growth, 0));transition:stroke-dashoffset .75s ease-out" />
      <path pathLength="1" d="M252 319c-26 8-50 27-68 53" stroke-width="3" style="stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--root-growth, 0));transition:stroke-dashoffset .75s ease-out" />
