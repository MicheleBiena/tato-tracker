    <g fill="none" stroke="var(--plant-stem, #416f59)" stroke-linecap="round" stroke-linejoin="round" style="opacity:var(--sprout-growth, 0);transform:translateY(calc((1 - var(--sprout-growth, 0)) * 46px)) scaleY(calc(.2 + var(--sprout-growth, 0) * .8));transform-origin:260px 220px;transition:opacity .35s ease-out,transform .75s cubic-bezier(.22,1,.36,1)">
      <path d="M263 169c-23-26-53-34-80-24 10 29 36 42 79 37Z" fill="var(--plant-leaf, #5e8c72)" stroke-width="4" />
