<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title description" style="--root-growth:1;--sprout-growth:1">
  <title id="title">Indicatore di avanzamento Pomodoro</title>
  <desc id="description">Stato finale dell'indicatore SVG: radici, patate e germoglio visibili.</desc>
  <style>
