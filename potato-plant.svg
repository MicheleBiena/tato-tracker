      <path d="M164 314c5-27 28-43 54-39 30 4 46 28 38 55-8 28-36 43-62 34-22-7-35-27-30-50Z" />
      <circle cx="193" cy="302" r="3.3" fill="var(--potato-eye, #8a5b35)" stroke="none" />
      <circle cx="227" cy="324" r="3" fill="var(--potato-eye, #8a5b35)" stroke="none" />
      <path d="M187 339c8 5 17 5 24 0" fill="none" stroke-linecap="round" />
    </g>
    <g fill="var(--potato-skin, #d9a15f)" stroke="var(--potato-outline, #8a5b35)" stroke-width="3" style="opacity:clamp(0,calc((var(--root-growth, 0) - .45) * 3),1);transform:scale(calc(.72 + var(--root-growth, 0) * .28));transform-origin:330px 344px;transition:opacity .35s ease-out,transform .55s ease-out">
