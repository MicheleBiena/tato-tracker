      <path d="M260 226c0-38-2-72 7-110" stroke-width="9" />
      <path d="M263 167c-25-28-52-34-78-25 8 28 32 43 77 41" fill="var(--plant-leaf, #5e8c72)" stroke-width="4" />
      <path d="M265 139c21-32 47-42 75-36-4 30-26 48-74 52" fill="var(--plant-leaf-light, #79a88a)" stroke-width="4" />
