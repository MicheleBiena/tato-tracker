    <path d="M0 260c78-18 142 10 220-5 100-19 196-4 300 10v155H0Z" fill="var(--soil-front, #946647)" opacity="0.5" />

    <g fill="none" stroke="var(--root-color, #f4dcc0)" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" d="M260 218c-5 43 4 78-11 118-6 18-17 35-31 49" stroke-width="7" style="stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--root-growth, 0));transition:stroke-dashoffset .75s ease-out" />
      <path pathLength="1" d="M257 266c-33 6-55 26-70 54-8 15-13 31-27 42" stroke-width="4" style="stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--root-growth, 0));transition:stroke-dashoffset .75s ease-out" />
      <path pathLength="1" d="M253 292c38 5 63 27 81 61 8 15 17 25 31 32" stroke-width="4.5" style="stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--root-growth, 0));transition:stroke-dashoffset .75s ease-out" />
